server:
  port: 8081
spring:
  jwt:
    secret: your-very-long-secret-key-at-least-32-characters
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  servlet:
    multipart:
      #配置文件的大小
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: SeetLeft
  datasource:
    url: jdbc:mysql://localhost:3306/seetpro
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    #jpa:
    # 移除了 database-platform 配置，让 Hibernate 自动选择合适的方言
  web:
    resources:
      #配置静态资源路径
      static-locations: classpath:/static/, file:./static/
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  data:
    #Redis配置信息!!!
    redis:
      #Redis联机地址，Lines:192.168.79.131,win:127.0.0.1
      host: 127.0.0.1
      #端口
      port: 6379
      #Redis提供了多个数据库，设置其中一个数据库进行连接
      database: 0
      #密码，如果没设置可以为空
      password: 123456
      #连接超时设置（建立连接的时间限制）
      connect-timeout: 10s
      #命令超时设置（执行命令的时间限制）
      timeout: 5s
      #Lettuce连接池配置（Spring Boot 2.x 默认）
      lettuce:
        pool:
          #最小空余的连接数量
          min-idle: 0
          #最大空余的连接数量
          max-idle: 8
          #最大活跃连接数
          max-active: 8
          #连接池最大阻塞等待时间
          max-wait: -1ms
      # 缓存配置
      cache:
        # 缓存类型：指定为Redis
        type: redis
        # Redis缓存配置
        redis:
          # 缓存过期时间
          time-to-live: 3600000ms
          # 是否允许缓存空值（防止缓存穿透）
          cache-null-values: true
          # 缓存键前缀
          key-prefix: "spring-boot-redis:"
          # 是否使用键前缀
          use-key-prefix: true
      # 或使用Jedis连接池配置（需要引入Jedis依赖）
      # jedis:
      #   pool:
      #     max-active: 15
      #     max-idle: 10
      #     min-idle: 5
      #     max-wait: 5000ms

mybatis:
  mapper-locations: classpath*:Mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
mybatis-plus:
  mapper-locations: classpath*:Mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.example.SeetLeft.Mapper: DEBUG
    com.example.SeetLeft.MapperPro: DEBUG
springdoc:
  api-docs:
    #Swagger-UI JSON格式请求路径
    path: /api-docs
    #默认启动
    enabled: true
  swagger-ui:
    #Swagger-UI 页面格式请求路径
    path: /Swagger.html
    #默认启动
    enabled: true
