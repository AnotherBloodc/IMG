spring:
  servlet:
    multipart:
      #配置文件的大小
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: SeetLeft
  datasource:
    url: jdbc:mysql://localhost:3306/seetpro
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    #jpa:
    # 移除了 database-platform 配置，让 Hibernate 自动选择合适的方言
  web:
    resources:
      #配置静态资源路径
      static-locations: classpath:/static/, file:./static/
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
mybatis:
  mapper-locations: classpath*:Mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
mybatis-plus:
  mapper-locations: classpath*:Mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.example.SeetLeft.Mapper: DEBUG
    com.example.SeetLeft.MapperPro: DEBUG
springdoc:
  swagger-ui.path: /UI.html
  api-docs.path: /api-docs