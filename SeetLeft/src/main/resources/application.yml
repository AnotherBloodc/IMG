server:
  port: 8080
spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.autoconfigure.security.servlet.SecurityAutoConfiguration
      - org.springframework.boot.actuate.autoconfigure.security.servlet.ManagementWebSecurityAutoConfiguration
  servlet:
    multipart:
      #配置文件的大小
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: SeetLeft
  datasource:
    url: jdbc:mysql://localhost:3306/seetpro
    username: root
    password: 123456
    driver-class-name: com.mysql.cj.jdbc.Driver
    #jpa:
    # 移除了 database-platform 配置，让 Hibernate 自动选择合适的方言
  web:
    resources:
      #配置静态资源路径
      static-locations: classpath:/static/, file:./static/
  mvc:
    pathmatch:
      matching-strategy: ant_path_matcher
  data:
    redis:
      host: 192.168.79.131
      port: 6379
      password: 123456
      connect-timeout: 10s
      # Lettuce连接池配置（Spring Boot 2.x 默认）
      lettuce:
        pool:
          # 最大活跃连接数
          max-active: 8
          # 最大空闲连接数
          max-idle: 8
          # 最小空闲连接数
          min-idle: 2
          # 连接池最大阻塞等待时间
          max-wait: 1000ms

      # 或使用Jedis连接池配置（需要引入Jedis依赖）
      # jedis:
      #   pool:
      #     max-active: 15
      #     max-idle: 10
      #     min-idle: 5
      #     max-wait: 5000ms

      # 缓存配置
      cache:
        # 缓存类型：指定为Redis
        type: redis
        # Redis缓存配置
        redis:
          # 缓存过期时间
          time-to-live: 3600000ms
          # 是否允许缓存空值（防止缓存穿透）
          cache-null-values: true
          # 缓存键前缀
          key-prefix: "spring-boot-redis:"
          # 是否使用键前缀
          use-key-prefix: true

mybatis:
  mapper-locations: classpath*:Mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
mybatis-plus:
  mapper-locations: classpath*:Mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true
logging:
  level:
    com.example.SeetLeft.Mapper: DEBUG
    com.example.SeetLeft.MapperPro: DEBUG
springdoc:
  swagger-ui.path: /UI.html
  api-docs.path: /api-docs
